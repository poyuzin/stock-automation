# ===========================================================
#  주식 자동화 설정 - 이 파일만 고치면 됩니다
# ===========================================================

report:
  title: "US Stock Daily"
  timezone: "Asia/Seoul"
  lookback_days: 420      # 지표 계산용으로 받아올 과거 일수
  sparkline_days: 60      # 대시보드 미니차트에 그릴 일수

  # 레포가 Public 이면 Pages 대시보드도 인터넷에 공개된다.
  # true 로 두면 웹 대시보드에서 포트폴리오 섹션(평가금액·수량·평단)을 빼고
  # 워치리스트와 알림만 올린다. 이메일에는 그대로 다 들어간다.
  # 레포가 Private 이면 false 로 바꿔도 된다.
  public_dashboard: true

# 관심 종목 (미국 주식 티커)
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - TSLA
  - SPY
  - QQQ

# 보유 종목
#
# ⚠️ 레포가 Public 이면 여기 적는 수량·평단가는 인터넷에 그대로 공개된다.
#
#    공개 레포에서 내 보유 종목을 추적하려면 이 파일에 적지 말고
#    GitHub Secret 에 넣으세요. Settings → Secrets and variables → Actions 에서
#    이름 PORTFOLIO_JSON, 값은 아래 형식의 JSON 한 줄:
#
#      {"cash": 2000, "holdings": [{"ticker":"AAPL","shares":12,"avg_price":178.40}]}
#
#    Secret 이 있으면 이 파일의 portfolio 설정을 덮어쓴다. Secret 값은
#    레포 주인만 볼 수 있고 Actions 로그에도 찍히지 않는다.
portfolio:
  currency: USD
  cash: 0
  holdings: []
  # - { ticker: AAPL,  shares: 12, avg_price: 178.40 }
  # - { ticker: NVDA,  shares: 20, avg_price: 118.65 }

# 알림 규칙
#   type: pct_change | rsi | sma_cross | price | pct_from_52w_high | volume_spike
#   severity: good | warning | serious | critical
#   ticker 를 지정하면 그 종목에만, 없으면 워치리스트 전체에 적용
alerts:
  - id: daily_drop
    type: pct_change
    window: 1
    below: -3.0
    severity: serious
    message: "{ticker} 하루 {value:+.2f}% — 낙폭 확대"

  - id: daily_surge
    type: pct_change
    window: 1
    above: 4.0
    severity: good
    message: "{ticker} 하루 {value:+.2f}% — 급등"

  - id: weekly_drop
    type: pct_change
    window: 5
    below: -8.0
    severity: serious
    message: "{ticker} 5거래일 {value:+.2f}%"

  - id: rsi_oversold
    type: rsi
    period: 14
    below: 30
    severity: warning
    message: "{ticker} RSI {value:.1f} — 과매도 구간"

  - id: rsi_overbought
    type: rsi
    period: 14
    above: 72
    severity: warning
    message: "{ticker} RSI {value:.1f} — 과매수 구간"

  - id: golden_cross
    type: sma_cross
    fast: 20
    slow: 60
    direction: up
    severity: good
    message: "{ticker} 20일선이 60일선 상향 돌파"

  - id: death_cross
    type: sma_cross
    fast: 20
    slow: 60
    direction: down
    severity: critical
    message: "{ticker} 20일선이 60일선 하향 이탈"

  - id: near_high
    type: pct_from_52w_high
    above: -1.5
    severity: good
    message: "{ticker} 52주 신고가 근접 ({value:+.1f}%)"

  - id: volume_spike
    type: volume_spike
    ratio: 2.5
    severity: warning
    message: "{ticker} 거래량 평균 대비 {value:.1f}배"

  # 특정 종목 목표가 알림 예시
  - id: nvda_target
    type: price
    ticker: NVDA
    below: 100.0
    severity: warning
    message: "NVDA ${value:.2f} — 지정 목표가 아래"

# 백테스트 설정 (수동 실행 워크플로에서 사용)
backtest:
  tickers: [AAPL, MSFT, NVDA, SPY]
  start: "2019-01-01"
  initial_cash: 10000
  fee_bps: 5              # 편도 수수료+슬리피지 (bp, 5 = 0.05%)
  strategies:
    - { name: "SMA 20/60",      type: sma_cross, fast: 20, slow: 60 }
    - { name: "SMA 50/200",     type: sma_cross, fast: 50, slow: 200 }
    - { name: "RSI 30/70",      type: rsi_reversion, period: 14, buy_below: 30, sell_above: 70 }

# 이메일 발송 (값은 GitHub Secrets 로 주입 - 여기에 비밀번호를 적지 마세요)
email:
  enabled: true
  subject: "[{date}] {title} — {alert_count}건 알림"
  only_when_alerts: false   # true 면 알림 있을 때만 메일 발송
  attach_dashboard: true    # 대시보드 HTML 을 메일에 첨부 (포트폴리오 포함 전체 버전)
