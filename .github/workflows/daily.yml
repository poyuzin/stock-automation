name: Daily Report

on:
  schedule:
    # 21:30 UTC = 미국 장 마감(16:00 ET) 직후 · 한국시간 06:30 다음 날
    # 서머타임 때는 마감 +30분, 겨울에는 마감 +30분 전후로 붙는다
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # Actions 탭에서 수동 실행
    inputs:
      send_email:
        description: "이메일도 보낼까요?"
        type: boolean
        default: true

permissions:
  contents: write           # 기록 JSON 커밋
  pages: write              # Pages 배포
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 리포트 생성 + 메일 발송
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # 공개 레포에서 보유 종목을 숨기고 싶을 때만 설정 (없으면 config.yml 사용)
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          SEND_EMAIL: ${{ github.event_name != 'workflow_dispatch' || inputs.send_email }}
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            python src/main.py report
          else
            python src/main.py report --no-email
          fi

      - name: 결과 커밋 (대시보드 + 일별 기록)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/history
          git diff --staged --quiet || git commit -m "chore: $(date -u +%Y-%m-%d) 리포트"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
