name: CI

# push / PR 마다 도는 검사. 실제 시장 데이터 없이 mock 으로 파이프라인이
# 끝까지 돌아가는지만 본다 - 장 마감 때 워크플로가 터지는 걸 미리 잡아준다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 스모크 테스트
        run: python tests/smoke_test.py
